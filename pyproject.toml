[project]
name = "ailab-evals"
version = "0.1.0"
description = "LLM evals harness: datasets, runners, calibrated LLM-as-judge, pairwise mode, and a regression-gate CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # stdlib only, on purpose: a host app can pin this by commit SHA with zero lock conflicts

[project.scripts]
ailab-evals = "ailab_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_evals"]

[tool.ruff]
line-length = 132
target-version = "py311"
# docs/assets holds the vendored README-graphics kit (long inline HTML/CSS strings).
# It is build tooling, not shipped code, so it is excluded from linting the package.
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip lengths are checked explicitly (metrics._check / runner) where it matters

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_fixtures.py" = ["E501"]  # hand-authored fixture prose
